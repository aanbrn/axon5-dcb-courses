[versions]
kotlin = "2.4.21"
spotless = "8.11.0"
# renovate: datasource=maven depName=com.facebook:ktfmt
ktfmt = "0.65"
# renovate: datasource=npm depName=prettier
prettier = "3.10.1"
detekt = "2.0.0-alpha.6"
dokka = "2.3.0"
foojay = "1.0.0"
junit = "6.0.3"
kotest = "6.2.7"
spring-boot = "4.1.3"
# Shared by the Axon Framework and Axoniq Framework BOMs, which release together.
axon = "5.4.2"
testcontainers = "2.0.5"
# The jackson-bom.version that spring-boot-dependencies declares for the spring-boot version above.
jackson = "3.1.8"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
foojay-resolver-plugin = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
kotest-bom = { module = "io.kotest:kotest-bom", version.ref = "kotest" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
axon-framework-bom = { module = "org.axonframework:axon-framework-bom", version.ref = "axon" }
axoniq-framework-bom = { module = "io.axoniq.framework:axoniq-framework-bom", version.ref = "axon" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core" }

[plugins]
detekt = { id = "dev.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }

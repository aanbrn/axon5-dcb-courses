# Strict overrides on top of the detekt defaults (buildUponDefaultConfig). There is no baseline file.
#
# The `excludes` lists below are detekt's own defaults for test source sets plus the test source
# sets of this repository: the TestKit test classes (`*FunctionalTest.kt`) and the JVM test suites
# `componentTest`, `integrationTest` and `architectureTest`. The defaults match `**/test/**`, which
# does not match any of those, and tests are named in backticked prose without KDoc. The shared
# TestKit fixture and the `testFixtures` source set are not excluded and stay fully documented.
comments:
  UndocumentedPublicClass:
    active: true
  UndocumentedPublicFunction:
    active: true
    excludes:
      [
        "**/test/**",
        "**/androidTest/**",
        "**/commonTest/**",
        "**/jvmTest/**",
        "**/androidUnitTest/**",
        "**/androidInstrumentedTest/**",
        "**/jsTest/**",
        "**/iosTest/**",
        "**/*FunctionalTest.kt",
        "**/componentTest/**",
        "**/integrationTest/**",
        "**/architectureTest/**",
      ]
  UndocumentedPublicProperty:
    active: true
    excludes:
      [
        "**/test/**",
        "**/androidTest/**",
        "**/commonTest/**",
        "**/jvmTest/**",
        "**/androidUnitTest/**",
        "**/androidInstrumentedTest/**",
        "**/jsTest/**",
        "**/iosTest/**",
        "**/*FunctionalTest.kt",
        "**/componentTest/**",
        "**/integrationTest/**",
        "**/architectureTest/**",
      ]
  OutdatedDocumentation:
    active: true
  KDocReferencesNonPublicProperty:
    active: true
  EndOfSentenceFormat:
    active: true

complexity:
  # A test class holds one function per behavior, so its size follows the number of behaviors it proves.
  TooManyFunctions:
    excludes:
      [
        "**/test/**",
        "**/androidTest/**",
        "**/commonTest/**",
        "**/jvmTest/**",
        "**/androidUnitTest/**",
        "**/androidInstrumentedTest/**",
        "**/jsTest/**",
        "**/iosTest/**",
        "**/*FunctionalTest.kt",
        "**/componentTest/**",
        "**/integrationTest/**",
        "**/architectureTest/**",
      ]

naming:
  FunctionNaming:
    excludes:
      [
        "**/test/**",
        "**/androidTest/**",
        "**/commonTest/**",
        "**/jvmTest/**",
        "**/androidUnitTest/**",
        "**/androidInstrumentedTest/**",
        "**/jsTest/**",
        "**/iosTest/**",
        "**/*FunctionalTest.kt",
        "**/componentTest/**",
        "**/integrationTest/**",
        "**/architectureTest/**",
      ]

style:
  # A backstop above the 120-column formatter limit: it flags only lines no formatter can break,
  # such as long string literals and URLs.
  MaxLineLength:
    maxLineLength: 140

name: Governance

# Pull request policy: governed files need the `governance-approved` label and same-repository
# branches follow the GSD or bot naming. The check needs the pull request context, so it lives in
# its own workflow; the single `governance-success` job is the stable context the ruleset requires.
# The file list comes from the list-pr-files.sh script, and an unusable `gh` result fails the step
# instead of reading as an empty list.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions: {}

# GitHub runs an explicit `bash` with `-e -o pipefail`; the default shell has no pipefail.
defaults:
  run:
    shell: bash

concurrency:
  group: governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the files of the pull request through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FILES_JSON: ${{ runner.temp }}/pr-files.json
        run: scripts/governance/list-pr-files.sh

      - name: Check governance policy
        env:
          PR_FILES_JSON: ${{ runner.temp }}/pr-files.json
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
        run: scripts/governance/check-pr.sh

  governance-success:
    name: governance-success
    needs: [governance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify all required jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

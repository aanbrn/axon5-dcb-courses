name: CodeQL

# Static analysis for the GitHub Actions workflows. The Kotlin (`java-kotlin`) leg is deliberately not
# part of this matrix yet: see docs/adr/0002-codeql-kotlin-analysis.md for the spike result and the
# criteria for enabling it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 2"

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      actions: read # read workflow run metadata for the analysis
    strategy:
      fail-fast: false
      matrix:
        include:
          # UPSTREAM: UP-0010 the CodeQL Kotlin extractor does not cover Kotlin 2.4.21 and found no sources here.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          # UPSTREAM: UP-0010 only `actions` is analysed until the Kotlin extractor works here (see the matrix above).
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

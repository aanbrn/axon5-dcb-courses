name: Scorecard

# OpenSSF Scorecard supply-chain checks. Results are published to the OpenSSF API (public repository)
# and uploaded to code scanning as SARIF. Scorecard's publishing requires that the workflow declares no
# workflow-level `env` or `defaults`, so none are declared here.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      actions: read # read workflow metadata for the analysis
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish the results with a short-lived OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

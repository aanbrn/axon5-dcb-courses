- name: "area:automation"
  color: "5319e7"
  description: "The automation service."
- name: "area:bff"
  color: "5319e7"
  description: "The API gateway and backend for frontend."
- name: "area:ui"
  color: "5319e7"
  description: "The React frontend."
- name: "area:docs"
  color: "5319e7"
  description: "The documentation site, ADRs and diagrams."


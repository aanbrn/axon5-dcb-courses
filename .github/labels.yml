# Repository labels as code (GH-11, D-18). The `Labels` workflow validates this file on pull
# requests and syncs it to GitHub from `main`; the sync is exact, so a label that is not listed
# here is deleted. Names that contain `:` or a space are quoted so that they parse as strings.
# Community labels (`good first issue`, `help wanted`, ...) are deliberately absent: Phase 13
# adds them together with the contribution guide.

# Conventional Commit type of the change.
- name: "type:feat"
  color: "1d76db"
  description: "A new feature."
- name: "type:fix"
  color: "1d76db"
  description: "A bug fix."
- name: "type:docs"
  color: "1d76db"
  description: "A documentation-only change."
- name: "type:chore"
  color: "1d76db"
  description: "Maintenance that changes neither behaviour nor documentation."
- name: "type:refactor"
  color: "1d76db"
  description: "A code change that neither fixes a bug nor adds a feature."
- name: "type:test"
  color: "1d76db"
  description: "Adding or correcting tests."
- name: "type:ci"
  color: "1d76db"
  description: "A change to the CI configuration or scripts."
- name: "type:build"
  color: "1d76db"
  description: "A change to the build system or external dependencies."
- name: "type:perf"
  color: "1d76db"
  description: "A change that improves performance."


# Repository-wide copyright and licence declaration (REUSE Specification 3.3).
#
# Files that carry their own SPDX header keep it; the aggregate annotation adds the project's
# default on top of it. Files that cannot carry a header (JSON, the wrapper jar, generated
# lockfiles such as mise.lock and .mise/locks/**) are covered by the same annotation.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexey Afanasyev"
SPDX-License-Identifier = "MIT"

# The Gradle wrapper is generated by Gradle and stays under the Apache-2.0 licence of its
# authors. "override" replaces the aggregate annotation and the Apache-2.0 header inside the
# scripts, so these files resolve to Apache-2.0 only.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/gradle-wrapper.jar"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc. and the original authors"
SPDX-License-Identifier = "Apache-2.0"

# Planning documents quote SPDX header text in prose, which REUSE would parse as a licence tag
# and reject. "override" makes REUSE ignore the file contents and use this annotation instead.
[[annotations]]
path = ".planning/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Alexey Afanasyev"
SPDX-License-Identifier = "MIT"

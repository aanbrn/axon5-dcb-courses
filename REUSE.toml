# Repository-wide copyright and licence declaration (REUSE Specification 3.3).
#
# Files that carry their own SPDX header keep it; the aggregate annotation adds the project's
# default on top of it. Files that cannot carry a header (JSON, the wrapper jar, generated
# lockfiles such as mise.lock and .mise/locks/**) are covered by the same annotation.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alexey Afanasyev"
SPDX-License-Identifier = "MIT"

# The Gradle wrapper is generated by Gradle and stays under the Apache-2.0 licence of its
# authors. "override" replaces the aggregate annotation and the Apache-2.0 header inside the
# scripts, so these files resolve to Apache-2.0 only.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/gradle-wrapper.jar"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc. and the original authors"
SPDX-License-Identifier = "Apache-2.0"

# Planning documents quote SPDX header text in prose, which REUSE would parse as a licence tag
# and reject. "override" makes REUSE ignore the file contents and use this annotation instead.
[[annotations]]
path = ".planning/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Alexey Afanasyev"
SPDX-License-Identifier = "MIT"

# The official TypeID test vectors are copied byte for byte from jetify-com/typeid, spec/valid.yml and
# spec/invalid.yml at commit 26a84e85491203834ed0d1c3423ba5f679a67114 (spec v0.3.0). They stay under the upstream
# licence and cannot carry a header without ceasing to be byte-identical copies.
[[annotations]]
path = "backend/contracts/kernel/src/test/resources/typeid/*.yml"
precedence = "override"
SPDX-FileCopyrightText = "Jetify Inc. and the TypeID contributors"
SPDX-License-Identifier = "Apache-2.0"

# The dynamic-consistency-boundaries agent skill is copied byte for byte from AxonIQ/AxonFramework. Its README.md names
# the pinned commit and the update procedure. The copies stay under the upstream licence and cannot carry a header
# without ceasing to be byte-identical; the README itself is the project's own file and keeps the aggregate annotation.
[[annotations]]
path = [
  ".claude/skills/dynamic-consistency-boundaries/SKILL.md",
  ".claude/skills/dynamic-consistency-boundaries/references/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 AxonIQ B.V. and the Axon Framework contributors"
SPDX-License-Identifier = "Apache-2.0"

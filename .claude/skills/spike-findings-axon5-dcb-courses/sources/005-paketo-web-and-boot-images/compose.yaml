# Spike 005: buildpack images end to end. Images are built by Gradle (see README).
name: spike005
services:
  api:
    image: spike005-api:latest
    mem_limit: 512m
    environment:
      # thc runs via `docker exec`, which bypasses the CNB launcher, so BPE_DEFAULT_THC_* from the image are not
      # visible to it: the health-check target must be set as container env.
      THC_PORT: "8080"
      THC_PATH: /actuator/health/readiness
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  web-custom:
    image: spike005-web-custom:latest
    ports: ["18081:8080"]
    environment:
      PORT: "8080"
      PROXY_BUFFERING: ${PROXY_BUFFERING:-off}
      THC_PORT: "8080"
      THC_PATH: /healthz
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 5s
      timeout: 3s
      retries: 20
  web-generated:
    image: spike005-web-generated:latest
    ports: ["18082:8080"]
    environment:
      PORT: "8080"
    depends_on:
      api: {condition: service_healthy}

# Custom nginx.conf: the Paketo nginx buildpack renders {{port}} and {{env "..."}} at launch.
worker_processes 1;
daemon off;
error_log stderr;
events { worker_connections 1024; }

http {
  # /workspace is read-only for the run user; the buildpack renders {{ tempDir }} to a writable path.
  client_body_temp_path {{ tempDir }}/client_body_temp;
  proxy_temp_path {{ tempDir }}/proxy_temp;
  fastcgi_temp_path {{ tempDir }}/fastcgi_temp;
  charset utf-8;
  log_format cnb 'NginxLog "$request" $status $body_bytes_sent';
  access_log /dev/stdout cnb;
  default_type application/octet-stream;
  include mime.types;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  port_in_redirect off;
  server_tokens off;

  server {
    listen {{port}};
    root dist;

    # Never serve dotfiles (except .well-known).
    location ~ /\.(?!well-known) { deny all; return 404; }

    location = /healthz { access_log off; default_type text/plain; }

    location /api/ {
      proxy_pass {{env "API_UPSTREAM"}};
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # SSE: stream through, never buffer or cache; keep idle streams open.
      proxy_buffering {{env "PROXY_BUFFERING"}};
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # SPA fallback: unknown paths serve index.html, which must never be cached.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
